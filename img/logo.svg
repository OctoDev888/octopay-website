    <path d="M256 205 L438 254 M256 205 L407 356 M256 205 L317 433 M256 205 L200 416 M256 205 L95 366 M256 205 L84 251"/>
  </g>
  <circle cx="256" cy="205" r="152" fill="#FFFFFF"/>
